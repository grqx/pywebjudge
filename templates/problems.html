<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Problems - PWJ</title>
  <link rel="stylesheet" href="{{url_for('static', filename='index.css')}}">
</head>
<body>
    <div class="topbar">
        {% if u is not none() %}
        <a href="/logout">Sign Out</a>
        {% else %}
        <a href="/login">Sign In</a>
        <a href="/sign-up">Sign Up</a>
        {% endif %}
    </div>
    <nav id="navbar">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/problems">Problems</a></li>
            <li><a href="/me">My account</a></li>
        </ul>
    </nav>

    <div class="vcafc">
        <table class="pretty-table">
            <caption>List of problems</caption>
            <thead>
                <th><p>Problem ID</p></th>
                <th><p>Problem title</p></th>
                <th><p>Pass rate</p></th>
            </thead>
            {% for problem in problems %}
            <tr>
                <td>
                    <a href="/problem/{{problem['id']}}">P{{problem['id']}}</a>
                </td>
                <td><p>{{problem['title']}}</p></td>
                <td><p>{{problem['__passrate']}}</p></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
