<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home - PWJ</title>
  <link rel="stylesheet" href="{{url_for('static', filename='index.css')}}">
</head>
<body>
    <div class="topbar">
        {% if u is not none() %}
        <a href="/logout">Sign Out</a>
        {% else %}
        <a href="/login">Sign In</a>
        <a href="/sign-up">Sign Up</a>
        {% endif %}
    </div>
    <nav id="navbar">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/problems">Problems</a></li>
            <li><a href="/me">My account</a></li>
        </ul>
    </nav>

    <div class="vcafc">
        <p>User Name: {{info['name']}}</p>
        <p>User Id: {{u}}</p>
        <p>Pass rate: {{passrate}}</p>
        <p>Attempted problems: </p>
        <div>
        {% for p_id in attempted %}
        <a href="/problem/{{p_id}}">P{{p_id}}</a>
        {% endfor %}
        </div>
    </div>
</body>
</html>
